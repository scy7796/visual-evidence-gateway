name: Build standalone release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: visual-evidence-gateway-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: visual-evidence-gateway-linux-arm64
          - os: windows-latest
            asset: visual-evidence-gateway-windows-x86_64.exe
          - os: macos-15-intel
            asset: visual-evidence-gateway-macos-x86_64
          - os: macos-15
            asset: visual-evidence-gateway-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        # typer is required by mcp's CLI submodule, which PyInstaller's
        # --collect-all mcp imports during analysis.
        run: python -m pip install --upgrade pip pyinstaller . typer
      - name: Build one-file executable
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name visual-evidence-gateway
          --collect-all mcp
          --collect-all visual_evidence_gateway
          src/visual_evidence_gateway/cli.py
      - name: Rename and smoke-test executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv dist/visual-evidence-gateway "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" healthcheck --json
      - name: Rename and smoke-test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/visual-evidence-gateway.exe "dist/${{ matrix.asset }}"
          & "dist/${{ matrix.asset }}" --version
          & "dist/${{ matrix.asset }}" healthcheck --json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Required for `gh release create --verify-tag`, which inspects the tag
      # through the local git repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          lines = []
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / "visual-evidence-gateway-SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
