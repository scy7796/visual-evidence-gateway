name: Build VisionSieve release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: visionsieve-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: visionsieve-linux-arm64
          - os: windows-latest
            asset: visionsieve-windows-x86_64.exe
          - os: macos-15-intel
            asset: visionsieve-macos-x86_64
          - os: macos-15
            asset: visionsieve-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller . typer
      - name: Build one-file executable
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name visionsieve
          --collect-all mcp
          --collect-all visionsieve_mcp
          --collect-all visual_evidence_gateway
          src/visionsieve_mcp/cli.py
      - name: Rename and smoke-test executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv dist/visionsieve "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" healthcheck --json
      - name: Rename and smoke-test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/visionsieve.exe "dist/${{ matrix.asset }}"
          & "dist/${{ matrix.asset }}" --version
          & "dist/${{ matrix.asset }}" healthcheck --json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          cp dist/* release-assets/
      - name: Build source archive
        run: |
          git archive --format=zip --prefix=visionsieve-mcp-${GITHUB_REF_NAME}/ -o "release-assets/visionsieve-mcp-${GITHUB_REF_NAME}-source.zip" HEAD
      - name: Generate SHA-256 manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          lines = []
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / "visionsieve-SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "VisionSieve MCP ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --verify-tag
