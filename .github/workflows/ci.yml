name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m compileall -q src tests scripts
      - run: python scripts/audit_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_artifacts.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        if: runner.os != 'Windows'
      - run: python -m pip install --force-reinstall --no-deps (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
        if: runner.os == 'Windows'
        shell: pwsh
      - run: visual-evidence-gateway-healthcheck --json
