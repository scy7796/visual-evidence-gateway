name: Publish VisionSieve MCP 1.0.0

on:
  push:
    branches:
      - "publish/v1.0.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and build Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          pytest
          python -m compileall -q src tests scripts
          python scripts/audit_release.py
          python -m build
          python -m twine check dist/*
          python scripts/verify_artifacts.py
          git archive --format=zip --prefix=visionsieve-mcp-1.0.0/ -o dist/visionsieve-mcp-1.0.0-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: package-assets
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/visionsieve-mcp-1.0.0-source.zip
          if-no-files-found: error

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: visionsieve-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: visionsieve-linux-arm64
          - os: windows-latest
            asset: visionsieve-windows-x86_64.exe
          - os: macos-15-intel
            asset: visionsieve-macos-x86_64
          - os: macos-15
            asset: visionsieve-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller . typer
      - name: Build one-file executable
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name visionsieve
          --collect-all mcp
          --collect-all visual_evidence_gateway
          --collect-all visionsieve_mcp
          src/visionsieve_mcp/cli.py
      - name: Rename and smoke-test executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv dist/visionsieve "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" healthcheck --json
      - name: Rename and smoke-test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/visionsieve.exe "dist/${{ matrix.asset }}"
          & "dist/${{ matrix.asset }}" --version
          & "dist/${{ matrix.asset }}" healthcheck --json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [package, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          files = sorted(path for path in root.iterdir() if path.is_file())
          lines = [f"{sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in files]
          (root / "visionsieve-SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Create v1.0.0 release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; refusing to replace an existing release."
            exit 1
          fi
          gh release create v1.0.0 release-assets/* \
            --target main \
            --title "VisionSieve MCP 1.0.0" \
            --notes-file RELEASE_NOTES.md
