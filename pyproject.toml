[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-evidence-gateway"
version = "0.5.0"
description = "Give text-first AI agents secure, minimal-context vision through one MCP tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Visual Evidence Gateway contributors" }]
keywords = ["mcp", "vision", "ocr", "model-context-protocol", "agent-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.0,<3",
  "Pillow>=10.4,<13",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.18",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.12",
  "twine>=6",
]

[project.scripts]
visual-evidence-gateway = "visual_evidence_gateway.cli:main"
visual-evidence-gateway-mcp = "visual_evidence_gateway.server:main"
visual-evidence-gateway-healthcheck = "visual_evidence_gateway.healthcheck:main"
visual-evidence-gateway-probe = "visual_evidence_gateway.probe:main"
visual-evidence-gateway-setup = "visual_evidence_gateway.setup_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_evidence_gateway = ["prompts/*.txt", "schemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
